name: UtilityHub Autonomous Engineering

on:
  workflow_dispatch:
    inputs:
      task:
        description: Engineering task to implement
        required: true
        type: string
      base_branch:
        description: Base branch
        required: false
        default: main
        type: string
  issues:
    types: [opened, labeled]

permissions:
  contents: read
  issues: write

jobs:
  delegate:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'autonomous-engineering')
    runs-on: ubuntu-latest
    steps:
      - name: Create and delegate engineering task
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTOMATION_TOKEN: ${{ secrets.COPILOT_AUTOMATION_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TASK: ${{ inputs.task }}
          INPUT_BASE: ${{ inputs.base_branch }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          if [ -n "${ISSUE_NUMBER:-}" ]; then
            number="${ISSUE_NUMBER}"
          else
            base="${INPUT_BASE:-main}"
            cat > task.md <<EOF
          ## Autonomous engineering task

          ${TASK}

          Acceptance process:
          Follow .github/copilot-instructions.md.
          Inspect current main and project documentation before changing code.
          Implement the smallest coherent solution.
          Add or update regression tests.
          Run npm test and the full Playwright E2E suite.
          Update required documentation.
          Open a focused pull request against ${base}.
          Do not merge directly to main.
          EOF
            number="$(gh issue create --repo "${REPOSITORY}" --title "[autonomous] ${TASK}" --label "autonomous-engineering" --body-file task.md | sed -n 's#.*/issues/##p')"
          fi

          if [ -z "${AUTOMATION_TOKEN}" ]; then
            echo "COPILOT_AUTOMATION_TOKEN is not configured. Task issue is ready for manual Copilot delegation."
            exit 0
          fi

          python - <<'PY' > payload.json
          import json, os
          print(json.dumps({
            "assignees":["copilot-swe-agent[bot]"],
            "agent_assignment":{
              "target_repo":os.environ["REPOSITORY"],
              "base_branch":os.environ.get("INPUT_BASE") or "main",
              "custom_instructions":(
                "Act as the UtilityHub autonomous software engineer. Read .github/copilot-instructions.md and durable project documentation. "
                "Inspect current repository state. Implement the task only when justified. Preserve unrelated changes. "
                "Run npm test and the full Playwright E2E suite. Diagnose failures instead of weakening tests. "
                "Update documentation and open a focused PR. Never merge directly to main."
              ),
              "custom_agent":"",
              "model":""
            }
          }))
          PY
          GH_TOKEN="${AUTOMATION_TOKEN}" gh api --method POST             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "/repos/${REPOSITORY}/issues/${number}/assignees"             --input payload.json
