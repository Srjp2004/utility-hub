name: UtilityHub Autonomous Engineering

on:
  workflow_dispatch:
    inputs:
      task:
        description: Engineering task to implement
        required: true
        type: string
      base_branch:
        description: Base branch
        required: false
        default: main
        type: string
  issues:
    types: [opened, labeled]

permissions:
  contents: read
  issues: write

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'autonomous-engineering')
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ steps.issue.outputs.issue_number }}
      base_branch: ${{ steps.context.outputs.base_branch }}
    steps:
      - id: context
        env:
          INPUT_BASE: ${{ inputs.base_branch }}
        run: echo "base_branch=${INPUT_BASE:-main}" >> "$GITHUB_OUTPUT"
      - id: issue
        name: Create or reuse engineering issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TASK: ${{ inputs.task }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BASE_BRANCH: ${{ inputs.base_branch }}
        run: |
          set -euo pipefail
          if [ -n "${ISSUE_NUMBER:-}" ]; then
            echo "issue_number=${ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export BASE="${BASE_BRANCH:-main}"
          python - <<'PY' > task.md
          import os
          print(f"""## Autonomous engineering task

{os.environ.get("TASK") or ""}

Acceptance process:
Follow .github/copilot-instructions.md.
Inspect current main and project documentation before changing code.
Implement the smallest coherent solution.
Add or update regression tests.
Run npm test and the full Playwright E2E suite.
Update required documentation.
Open a focused pull request against {os.environ["BASE"]}.
Do not merge directly to main.
""")
          PY
          number="$(gh issue create --repo "${REPOSITORY}" --title "[autonomous] ${TASK}" --label "autonomous-engineering" --body-file task.md | sed -n 's#.*/issues/##p')"
          echo "issue_number=${number}" >> "$GITHUB_OUTPUT"

  delegate:
    needs: prepare
    if: needs.prepare.result == 'success' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'autonomous-engineering'))
    runs-on: ubuntu-latest
    steps:
      - name: Delegate with isolated automation credential
        env:
          GH_TOKEN: ${{ secrets.COPILOT_AUTOMATION_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ needs.prepare.outputs.issue_number }}
          BASE_BRANCH: ${{ needs.prepare.outputs.base_branch }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "COPILOT_AUTOMATION_TOKEN is not configured; manual delegation remains available."
            exit 0
          fi
          python - <<'PY' > payload.json
          import json, os
          print(json.dumps({
            "assignees":["copilot-swe-agent[bot]"],
            "agent_assignment":{
              "target_repo":os.environ["REPOSITORY"],
              "base_branch":os.environ["BASE_BRANCH"],
              "custom_instructions":"Act as the UtilityHub autonomous software engineer. Read .github/copilot-instructions.md and durable project documentation. Inspect current state, implement only justified changes, preserve unrelated work, run npm test and full Playwright E2E, diagnose failures instead of weakening tests, update docs, and open a focused PR. Never merge directly to main.",
              "custom_agent":"",
              "model":""
            }
          }))
          PY
          gh api --method POST -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "/repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/assignees" --input payload.json
