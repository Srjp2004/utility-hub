name: UtilityHub Engineering Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: 41 3 * * 1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Check dangerous JavaScript primitives
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude-dir=node_modules --include='*.js' --include='*.mjs' --include='*.html'             -e '(^|[^[:alnum:]_])eval[[:space:]]*\('             -e 'new[[:space:]]+Function[[:space:]]*\('             -e 'document\.write[[:space:]]*\(' .; then
            echo "Dangerous JavaScript primitive detected."
            exit 1
          fi
